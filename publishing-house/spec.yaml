project:
  slug: "ocp5-virt-rh1"
  owner_email: "acowles@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "rh1_2027"
  showroom_type: "classic"
  intake_type: "new"
  automation_type: "ansible"
  description: "A hands-on lab introducing new virtualization specific features and capabilities found in OpenShift 5, and exploring common and well understood workflows in this new environment."
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-1234"
  workflow_id: "713ad77f-ca41-4e06-b358-c45dd774a61a"

spec:
  title: "OpenShift 5 Virtualization Lab"
  learning_objectives:
    - "Create and manage virtual machines using the Red Hat OpenShift Virtualization console and CLI"
    - "Demonstrate live migration and core VM lifecycle operations in OpenShift 5"
    - "Configure VM networking within an OpenShift cluster using network attachment definitions and user-defined networks"
    - "Configure VM storage within an OpenShift cluster using persistent volumes, snapshots, and clones"
    - "Implement backup and recovery for virtual machines using OADP"
    - "Deploy and manage VM templates and instance types for standardized VM provisioning"
    - "Expose virtual machine-hosted applications using OpenShift services and routes"
    - "Migrate virtual machines from external hypervisors into OpenShift using Migration Toolkit for Virtualization"
    - "Create and troubleshoot virtual machines using OpenShift Lightspeed and the OCP5 MCP server integration"
    - "Explore new OpenShift 5 virtualization capabilities integrated throughout the platform"
  modules:
    - id: module-01
      title: "Introduction and Environment Overview"
      duration_min: 15
      status: not_started
    - id: module-02
      title: "Virtual Machine Management"
      duration_min: 40
      status: not_started
    - id: module-03
      title: "Migrating Existing VMs with MTV"
      duration_min: 30
      status: not_started
    - id: module-04
      title: "VM Storage Management"
      duration_min: 20
      status: not_started
    - id: module-05
      title: "Backup and Recovery with OADP"
      duration_min: 20
      status: not_started
    - id: module-06
      title: "Templates and InstanceType Management"
      duration_min: 20
      status: not_started
    - id: module-07
      title: "VM Networking"
      duration_min: 25
      status: not_started
    - id: module-08
      title: "Working with VMs and Applications"
      duration_min: 20
      status: not_started
  environment:
    platform: "ocp"            # ocp | rhel-vms — determines which sizing fields apply
    topology: "shared-cluster" # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv        # cnv | aws | troshka — cnv is default
    max_concurrent_users: 20   # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: "5.0"                 # e.g. 4.20 — minimum 4.20; leave empty for rhel-vms
    cluster_type: "multinode"          # sno | multinode — only for platform = ocp
    control_plane_instance_count: 3    # 1 if sno, 3 if multinode
    control_plane_cpu: 16              # 32 if sno, 16 if multinode
    control_plane_ram_gb: 64           # 128 if sno, 64 if multinode
    worker_count: 6                    # number of OCP worker nodes
    worker_cpu: 16                     # vCPU per worker
    worker_ram_gb: 64                  # RAM per worker in GB
    worker_disk_gb: 200                # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student: []

    # --- Common fields (both platforms) ---
    aap_version: ""                    # required if AAP in products
    ai_requirement: "maas"             # maas | gpu | none
    ai_model_tier: "frontier"          # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: "gpt-5"             # specific model e.g. granite-3.1-8b
    ai_justification: "Prior experience with GPT-4 and lesser open-source models produced suboptimal OpenShift Lightspeed interactions for VM creation and troubleshooting workflows. Frontier model quality is needed to effectively demonstrate product capabilities. Open-source models may be substituted at publication if quality is sufficient."
    non_ga_products: []                # list of non-GA products/versions
    non_ga_access_plan: ""             # how access is provided for non-GA products
    external_services:
      - quay.io
      - registry.access.redhat.com
      - cdn.redhat.com
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours: 3
  audience: "intermediate"               # beginner | intermediate | advanced

