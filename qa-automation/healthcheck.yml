---
# Read-only health check for the services this lab's automation deploys.
# Exit 0 = healthy, non-zero = unhealthy.
#
# Every check is one cluster-wide query compared against the number of users,
# so the runtime is the same for 2 users or 20. Failures are collected rather
# than failed fast, so one run reports everything that is broken.
#
#   curl -sk -N "$SHOWROOM_URL/stream/qa/healthcheck"
#
# The runner ServiceAccount needs cluster-scoped reads. In AgnosticV:
#   ocp4_workload_showroom_runtime_automation_cluster_admin: true

- name: Environment health check
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: "{{ k8s_kubeconfig | default(omit) }}"
  vars:
    failures: []

  tasks:

    - name: Get namespaces
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
      register: namespaces
      failed_when: false

    - name: Fail early if cluster-scoped reads are not allowed
      ansible.builtin.assert:
        that: namespaces.resources | default([]) | length > 0
        fail_msg: >-
          Cannot list namespaces, so no check below would be meaningful. Either
          the cluster is unreachable, or the runtime-automation ServiceAccount
          has no cluster-scoped reads - that needs
          ocp4_workload_showroom_runtime_automation_cluster_admin: true and
          ocp4_workload_showroom_runtime_automation_cluster_role: cluster-reader
          in the AgnosticV common.yaml.
        success_msg: Cluster-scoped read access confirmed.

    - name: Count the users this lab was provisioned for
      ansible.builtin.set_fact:
        users: >-
          {{ namespaces.resources | map(attribute='metadata.name')
             | select('match', '^showroom-user[0-9]+$') | list | length }}

    - name: Fail when nothing was provisioned
      ansible.builtin.set_fact:
        failures: "{{ failures + ['no showroom-user* namespaces exist, nothing was provisioned'] }}"
      when: users | int == 0

    - name: Get operators
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        label_selectors:
          # OLM copies every CSV into every namespace; without this it returns 700+.
          - "!olm.copiedFrom"
      register: operators
      failed_when: false

    - name: Fail when no operators were found
      ansible.builtin.set_fact:
        failures: "{{ failures + ['no ClusterServiceVersions returned, operators could not be checked'] }}"
      when: operators.resources | default([]) | length == 0

    - name: Fail when an operator did not install
      vars:
        broken: >-
          {{ operators.resources | default([]) | selectattr('status.phase', 'defined')
             | rejectattr('status.phase', 'equalto', 'Succeeded')
             | map(attribute='metadata.name') | list }}
      ansible.builtin.set_fact:
        failures: "{{ failures + ['operators not installed: ' ~ broken | join(', ')] }}"
      when: broken | length > 0

    - name: Get the object storage bucket StorageClass
      kubernetes.core.k8s_info:
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: openshift-storage.noobaa.io
      register: bucket_storageclass
      failed_when: false

    - name: Fail when object storage cannot serve buckets
      ansible.builtin.set_fact:
        failures: >-
          {{ failures + ['object storage: StorageClass openshift-storage.noobaa.io is missing,'
          ~ ' so no ObjectBucketClaim can bind. Check that the NooBaa system is Ready'] }}
      when: bucket_storageclass.resources | default([]) | length == 0

    - name: Get backup storage locations
      kubernetes.core.k8s_info:
        api_version: velero.io/v1
        kind: BackupStorageLocation
      register: backup_locations
      failed_when: false

    - name: Fail when a user has no usable backup location
      vars:
        available: >-
          {{ backup_locations.resources | default([]) | selectattr('status.phase', 'defined')
             | selectattr('status.phase', 'equalto', 'Available') | list | length }}
      ansible.builtin.set_fact:
        failures: >-
          {{ failures + ['backup: ' ~ available ~ ' of ' ~ users
             ~ ' BackupStorageLocations Available, backup and restore will fail'] }}
      when: available | int < users | int

    - name: Get OpenShift Virtualization
      kubernetes.core.k8s_info:
        api_version: hco.kubevirt.io/v1
        kind: HyperConverged
      register: hyperconverged
      failed_when: false

    - name: Fail when OpenShift Virtualization is not Available
      vars:
        available: >-
          {{ hyperconverged.resources | default([]) | selectattr('status.conditions', 'defined')
             | map(attribute='status.conditions') | flatten
             | selectattr('type', 'equalto', 'Available')
             | selectattr('status', 'equalto', 'True') | list | length }}
      ansible.builtin.set_fact:
        failures: "{{ failures + ['virtualization: HyperConverged is not Available, no VM can run'] }}"
      when: available | int == 0

    - name: Get boot images
      kubernetes.core.k8s_info:
        api_version: cdi.kubevirt.io/v1beta1
        kind: DataSource
        namespace: openshift-virtualization-os-images
      register: boot_images
      failed_when: false

    # Only the images the lab guide boots from. The cluster ships many more
    # (rhel7, win*) that are legitimately not Ready here.
    - name: Fail when a boot image the lab guide uses is not Ready
      vars:
        image: >-
          {{ boot_images.resources | default([])
             | selectattr('metadata.name', 'equalto', item) | first | default({}, true) }}
      ansible.builtin.set_fact:
        failures: "{{ failures + ['boot image ' ~ item ~ ' is not Ready, VMs created from it will fail'] }}"
      loop: [fedora, rhel9, centos-stream10]
      when: >-
        (image.status | default({}, true)).conditions | default([], true)
        | selectattr('type', 'equalto', 'Ready')
        | selectattr('status', 'equalto', 'True') | list | length == 0

    - name: Get the staged application VMs
      kubernetes.core.k8s_info:
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        label_selectors:
          - app.kubernetes.io/part-of=3-Tier-App
      register: staged_vms
      failed_when: false

    - name: Fail when a user is missing staged VMs
      vars:
        found: "{{ staged_vms.resources | default([]) | length }}"
      ansible.builtin.set_fact:
        failures: "{{ failures + ['staged VMs: ' ~ found ~ ' of ' ~ (users | int * 3) ~ ' exist'] }}"
      when: found | int < users | int * 3

    # They are deployed stopped, so Running is not the signal - an error is.
    - name: Fail when a staged VM is in an error state
      vars:
        broken: >-
          {{ staged_vms.resources | default([]) | selectattr('status.printableStatus', 'defined')
             | selectattr('status.printableStatus', 'search', 'Err|BackOff|Unknown')
             | map(attribute='metadata.namespace') | unique | list }}
      ansible.builtin.set_fact:
        failures: "{{ failures + ['staged VMs in an error state in: ' ~ broken | join(', ')] }}"
      when: broken | length > 0

    - name: Get the MTV source providers
      kubernetes.core.k8s_info:
        api_version: forklift.konveyor.io/v1beta1
        kind: Provider
      register: providers
      failed_when: false

    # status.phase is not used: it drops out of Ready while MTV re-validates
    # its inventory (measured 20/20 then 4/20 on a healthy cluster). The
    # connection condition held throughout and is what actually matters.
    - name: Fail when a provider cannot reach vCenter
      vars:
        connected: >-
          {{ providers.resources | default([]) | selectattr('metadata.name', 'equalto', 'vmware')
             | selectattr('status.conditions', 'defined')
             | map(attribute='status.conditions') | flatten
             | selectattr('type', 'equalto', 'ConnectionTestSucceeded')
             | selectattr('status', 'equalto', 'True') | list | length }}
      ansible.builtin.set_fact:
        failures: >-
          {{ failures + ['migration: ' ~ connected ~ ' of ' ~ users
             ~ ' vmware providers can reach vCenter, migration plans will not validate'] }}
      when: connected | int < users | int

    - name: Get the secondary network bridge policies
      kubernetes.core.k8s_info:
        api_version: nmstate.io/v1
        kind: NodeNetworkConfigurationPolicy
      register: bridge_policies
      failed_when: false

    - name: Fail when the secondary network bridge did not apply
      vars:
        total: "{{ bridge_policies.resources | default([]) | length }}"
        available: >-
          {{ bridge_policies.resources | default([]) | selectattr('status.conditions', 'defined')
             | map(attribute='status.conditions') | flatten
             | selectattr('type', 'equalto', 'Available')
             | selectattr('status', 'equalto', 'True') | list | length }}
      ansible.builtin.set_fact:
        failures: >-
          {{ failures + ['networking: ' ~ available ~ ' of ' ~ total
             ~ ' bridge policies Available, VM bridge networking will fail'] }}
      when: total | int == 0 or available | int < total | int

    - name: Get the lab guide pods
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        label_selectors:
          - app.kubernetes.io/name=showroom
      register: showroom_pods
      failed_when: false

    - name: Fail when a user has no lab guide pod
      vars:
        found: "{{ showroom_pods.resources | default([]) | map(attribute='metadata.namespace') | unique | list | length }}"
      ansible.builtin.set_fact:
        failures: "{{ failures + ['lab guide: ' ~ found ~ ' of ' ~ users ~ ' users have a Showroom pod'] }}"
      when: found | int < users | int

    - name: Fail when a lab guide container is not ready
      vars:
        unready: >-
          {{ showroom_pods.resources | default([]) | selectattr('status.containerStatuses', 'defined')
             | map(attribute='status.containerStatuses') | flatten | rejectattr('ready') | list }}
      ansible.builtin.set_fact:
        failures: >-
          {{ failures + ['lab guide: ' ~ (unready | length) ~ ' containers not ready ('
             ~ (unready | map(attribute='name') | unique | join(', ')) ~ ')'] }}
      when: unready | length > 0

    - name: Report healthy
      ansible.builtin.debug:
        msg: "Healthy. {{ users }} users provisioned, no failures found."
      when: failures | length == 0

    - name: Report unhealthy
      ansible.builtin.fail:
        msg: |
          Health check failed with {{ failures | length }} issue(s):
          {% for f in failures %}
            - {{ f }}
          {% endfor %}
      when: failures | length > 0
