---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: 'system:openshift:aggregate-to-basic-user'
  labels:
    authorization.openshift.io/aggregate-to-basic-user: 'true'
  annotations:
    rbac.authorization.kubernetes.io/autoupdate: 'false'
rules:
  - verbs:
      - get
    apiGroups:
      - ''
      - user.openshift.io
    resources:
      - users
    resourceNames:
      - '~'
  - verbs:
      - list
    apiGroups:
      - ''
      - project.openshift.io
    resources:
      - projectrequests
  - verbs:
      - get
      - list
    apiGroups:
      - ''
      - authorization.openshift.io
    resources:
      - clusterroles
  - verbs:
      - get
      - list
      - watch
    apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
  - verbs:
      - get
      - list
    apiGroups:
      - storage.k8s.io
    resources:
      - storageclasses
  - verbs:
      - list
      - watch
    apiGroups:
      - ''
      - project.openshift.io
    resources:
      - projects
  - verbs:
      - create
    apiGroups:
      - ''
      - authorization.openshift.io
    resources:
      - selfsubjectrulesreviews
  - verbs:
      - create
    apiGroups:
      - authorization.k8s.io
    resources:
      - selfsubjectaccessreviews
  - verbs:
      - get
      - list
      - watch
    apiGroups:
      - kubevirt.io
    resources:
      - kubevirts
  - verbs:
      - get
      - list
      - watch
    apiGroups:
      - hco.kubevirt.io
    resources:
      - hyperconvergeds
  - verbs:
      - get
      - list
      - watch
    apiGroups:
      - user.openshift.io
    resources:
      - users
