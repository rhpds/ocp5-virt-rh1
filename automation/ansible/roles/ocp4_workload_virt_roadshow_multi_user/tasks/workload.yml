---
- name: Set up user permissions to see installed operators
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('file', resource | from_yaml) }}"
  loop:
    - clusterrole-operator-viewer.yaml
    - clusterrolebinding-operator-view.yaml
    - clusterrolebinding-template-view.yaml
  loop_control:
    loop_var: resource

- name: Set up user permissions to see things in system namespaces
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('file', resource | from_yaml) }}"
  loop:
    - rolebinding-openshift-view.yaml
    - rolebinding-openshift-images-os-view.yaml
  loop_control:
    loop_var: resource

- name: Set up user permissions to fix missing kubevirt permissions
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', resource | from_yaml) }}"
  loop:
    - configmap-ui-settings.yaml.j2
    - configmap-user-settings.yaml.j2
    - role-kubevirt-ui-features-reader.yaml.j2
    - role-kubevirt-user-settings-reader.yaml.j2
    - rolebinding-kubevirt-ui-features-reader.yaml.j2
    - rolebinding-kubevirt-user-settings-reader.yaml.j2
    - rolebinding-kubevirt-user-migrate.yaml.j2
  loop_control:
    loop_var: resource

- name: Add namespaces for UDN
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'udn-namespace.yaml.j2' | from_yaml) }}"

- name: Create the workshop-users group
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'group-workshop-users.yaml.j2' | from_yaml) }}"

- name: Extend built-in roles for workshop users
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('file', resource | from_yaml) }}"
  loop:
    - role-shared-resource-viewer.yaml
    - clusterrole-aggregate-to-basic-user.yaml
  loop_control:
    loop_var: resource

- name: Create workshop cluster roles and bind them to the workshop-users group
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('file', resource | from_yaml) }}"
  loop:
    - clusterrole-workshop-virtualization-overview.yaml
    - clusterrole-workshop-monitoring-metrics.yaml
    - clusterrolebinding-workshop-virtualization-overview.yaml
    - clusterrolebinding-workshop-monitoring-metrics.yaml
  loop_control:
    loop_var: resource

- name: Grant authenticated OAuth users additional view access
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('file', resource | from_yaml) }}"
  loop:
    - clusterrole-pod-viewer.yaml
    - clusterrole-workload-viewer.yaml
    - clusterrolebinding-cnv-metrics-ui-viewer.yaml
    - clusterrolebinding-cdi-view.yaml
    - clusterrolebinding-pod-viewer.yaml
    - clusterrolebinding-workload-viewer.yaml
    - clusterrolebinding-olm-view.yaml
  loop_control:
    loop_var: resource
