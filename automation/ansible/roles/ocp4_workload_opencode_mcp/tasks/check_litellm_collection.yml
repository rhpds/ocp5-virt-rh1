---
# Per-user keys reuse rhpds.litellm_virtual_keys. It is not a galaxy.yml
# dependency: the catalog item installs it (requirements_content) and owns its
# version, so declaring it here too would conflict on a version mismatch.
- name: Fail when the rhpds.litellm_virtual_keys collection is not installed
  ansible.builtin.assert:
    that: _litellm_collection_paths | length > 0
    fail_msg: >-
      ocp4_workload_opencode_mcp_llm_per_user_keys needs the rhpds.litellm_virtual_keys
      collection (https://github.com/rhpds/rhpds.litellm_virtual_keys.git).
      Add it to requirements_content in the catalog item.
    quiet: true
  vars:
    _litellm_collection_paths: >-
      {{ lookup('ansible.builtin.config', 'COLLECTIONS_PATHS')
         | map('expanduser')
         | map('regex_replace', '$', '/ansible_collections/rhpds/litellm_virtual_keys/roles/ocp4_workload_litellm_virtual_keys')
         | select('ansible.builtin.exists')
         | list }}

- name: Fail when LiteLLM is not configured for per-user keys
  ansible.builtin.assert:
    that:
    - litellm_url | default('') | length > 0
    - litellm_master_key | default('') | length > 0
    fail_msg: >-
      litellm_url and litellm_master_key must be set
      when ocp4_workload_opencode_mcp_llm_per_user_keys is true.
    quiet: true
